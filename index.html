<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分帳記帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;padding:16px;max-width:480px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top-bar h1{font-size:18px;font-weight:600}
.settings-btn{font-size:13px;padding:6px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#555;cursor:pointer}
.people-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.person-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px 10px;text-align:center}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;margin:0 auto 8px}
.person-name{font-size:14px;font-weight:600;margin-bottom:4px}
.person-debt{font-size:20px;font-weight:600;margin-bottom:2px}
.person-label{font-size:11px;color:#888}
.debt-red{color:#c0392b}
.debt-zero{color:#aaa}
.add-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-bottom:12px}
.field-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.field-row:last-child{margin-bottom:0}
.field-row label{font-size:13px;color:#666;min-width:36px;white-space:nowrap;flex-shrink:0}
.seg-btns{display:flex;gap:6px;flex:1;min-width:0}
.seg-btn{flex:1;padding:8px 4px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;white-space:nowrap}
.seg-btn.on{background:#1a1a1a;border-color:#1a1a1a;color:#fff;font-weight:600}
.who-btn{flex:1;padding:8px 4px;font-size:13px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;white-space:nowrap}
.who-btn.on-0{background:#e1f5ee;border-color:#1D9E75;color:#085041;font-weight:600}
.who-btn.on-1{background:#e6f1fb;border-color:#378ADD;color:#0C447C;font-weight:600}
.amount-note-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.amount-note-row label{font-size:13px;color:#666;min-width:36px;white-space:nowrap;flex-shrink:0}
.amount-note-row input[type="number"]{width:90px;flex-shrink:0;font-size:14px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;color:#1a1a1a}
.amount-note-row input[type="number"]:focus{border-color:#555}
.amount-note-row input[type="text"]{flex:1;min-width:0;font-size:14px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;color:#1a1a1a}
.amount-note-row input[type="text"]:focus{border-color:#555}
.submit-btn{width:100%;padding:11px;font-size:15px;font-weight:600;border:none;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.status-bar{font-size:13px;text-align:center;padding:6px 0;min-height:28px;color:#888}
.status-bar.err{color:#c0392b}
.status-bar.ok{color:#0F6E56}
.log-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;margin-bottom:12px}
.log-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f0}
.log-head-label{font-size:13px;font-weight:600;color:#666}
.refresh-btn{font-size:12px;padding:4px 10px;border:1px solid #ddd;border-radius:999px;background:#fff;color:#666;cursor:pointer}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #f5f5f5;gap:8px}
.log-entry:last-child{border-bottom:none}
.log-left{flex:1;min-width:0}
.log-note{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-meta{font-size:12px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-right{display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.log-amt{font-weight:600;font-size:14px}
.del-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;line-height:1;padding:0 2px;flex-shrink:0}
.empty-log{padding:1.5rem;text-align:center;font-size:13px;color:#aaa}
.settle-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-bottom:12px}
.settle-title{font-size:12px;font-weight:600;color:#888;margin-bottom:10px;letter-spacing:0.05em;text-transform:uppercase}
.settle-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.settle-row:last-child{border-bottom:none}
.paid-btn{font-size:12px;padding:4px 12px;border-radius:999px;background:#e1f5ee;color:#0F6E56;border:none;cursor:pointer;font-weight:600;white-space:nowrap}
.cat-tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;margin-right:4px;flex-shrink:0}
.cat-meal{background:#faeeda;color:#633806}
.cat-other{background:#f0f0f0;color:#555}
.settings-panel{display:none;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-bottom:12px}
.settings-panel.open{display:block}
.settings-panel h2{font-size:14px;font-weight:600;margin-bottom:14px;color:#333}
.name-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.name-row:last-of-type{margin-bottom:14px}
.name-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.name-row input{flex:1;font-size:14px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;outline:none;color:#1a1a1a}
.name-row input:focus{border-color:#555}
.save-names-btn{width:100%;padding:10px;font-size:14px;font-weight:600;border:none;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer}
.warn-text{font-size:12px;color:#aaa;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<div class="top-bar">
  <h1>分帳記帳</h1>
  <button class="settings-btn" onclick="toggleSettings()">成員設定</button>
</div>

<div class="settings-panel" id="settings-panel">
  <h2>編輯成員名稱</h2>
  <div class="name-row">
    <div class="name-avatar" style="background:#e1f5ee;color:#085041" id="av0"></div>
    <input type="text" id="name0" maxlength="8" placeholder="成員1名稱">
  </div>
  <div class="name-row">
    <div class="name-avatar" style="background:#e6f1fb;color:#0C447C" id="av1"></div>
    <input type="text" id="name1" maxlength="8" placeholder="成員2名稱">
  </div>
  <button class="save-names-btn" onclick="saveNames()">儲存名稱</button>
  <p class="warn-text">⚠ 修改名稱後，Sheets 中舊有記錄不會自動更新，建議開始記帳前先設定好。</p>
</div>

<div class="people-grid" id="people-grid"></div>

<div class="add-box">
  <div class="field-row">
    <label>項目</label>
    <div class="seg-btns">
      <button class="seg-btn" id="cat-meal" onclick="selectCat('餐費')">餐費</button>
      <button class="seg-btn" id="cat-other" onclick="selectCat('其他')">其他</button>
    </div>
  </div>
  <div class="field-row">
    <label>欠誰</label>
    <div class="seg-btns" id="who-btns"></div>
  </div>
  <div class="amount-note-row">
    <label>金額</label>
    <input type="number" id="amt" placeholder="NT$" min="1">
    <input type="text" id="note" placeholder="備註（選填）" maxlength="6">
  </div>
  <div class="field-row">
    <button class="submit-btn" id="submit-btn" onclick="addEntry()">新增記帳</button>
  </div>
</div>

<div class="status-bar" id="status"></div>

<div class="log-box">
  <div class="log-head">
    <span class="log-head-label" id="log-title">記帳明細</span>
    <button class="refresh-btn" onclick="loadData()">重新整理</button>
  </div>
  <div id="log-list"><div class="empty-log">載入中...</div></div>
</div>

<div class="settle-box">
  <div class="settle-title">月底結算</div>
  <div id="settle-rows"></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyd39zCnVrrgfc1NGHtEQBUD9hrW5cTzz0lXEp1BQC-UNTKBBYLYcyMkcO6ix-WAA1g/exec';

const COLORS = [
  {avbg:'#e1f5ee', avco:'#085041'},
  {avbg:'#e6f1fb', avco:'#0C447C'},
];

const DEFAULT_NAMES = ['詩','旭'];

function loadNames() {
  try {
    const s = localStorage.getItem('member_names_v2');
    if (s) return JSON.parse(s);
  } catch(e){}
  return [...DEFAULT_NAMES];
}

let MEMBERS = loadNames().map((name,i) => ({name,...COLORS[i]}));
let entries = [];
let selectedWho = null;
let selectedCat = null;
let settingsOpen = false;

function toggleSettings() {
  settingsOpen = !settingsOpen;
  document.getElementById('settings-panel').classList.toggle('open', settingsOpen);
  if (settingsOpen) {
    MEMBERS.forEach((m,i) => {
      document.getElementById('name'+i).value = m.name;
      document.getElementById('av'+i).textContent = m.name[0]||'?';
    });
    [0,1].forEach(i => {
      document.getElementById('name'+i).oninput = () => {
        document.getElementById('av'+i).textContent = document.getElementById('name'+i).value[0]||'?';
      };
    });
  }
}

function saveNames() {
  const names = [0,1].map(i => document.getElementById('name'+i).value.trim());
  if (names.some(n => !n)) { alert('名稱不能為空'); return; }
  MEMBERS = names.map((name,i) => ({name,...COLORS[i]}));
  localStorage.setItem('member_names_v2', JSON.stringify(names));
  selectedWho = null;
  settingsOpen = false;
  document.getElementById('settings-panel').classList.remove('open');
  setStatus('名稱已更新', 'ok');
  setTimeout(() => setStatus(''), 2000);
  render();
}

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar' + (type ? ' '+type : '');
}

async function apiCall(body) {
  const resp = await fetch(API, {method:'POST', body:JSON.stringify(body)});
  return resp.json();
}

async function loadData() {
  setStatus('讀取中...');
  try {
    const res = await apiCall({action:'getAll'});
    if (!res.ok) throw new Error(res.error);
    const rows = res.rows || [];
    entries = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r[0] && !r[1]) continue;
      entries.push({date:r[0], who:r[1], amount:parseFloat(r[2])||0, cat:r[3]||'', note:r[4]||''});
    }
    setStatus('');
    render();
  } catch(e) {
    setStatus('讀取失敗：' + e.message, 'err');
  }
}

function selectWho(i) {
  selectedWho = selectedWho === i ? null : i;
  renderWhobtns();
}

function selectCat(cat) {
  selectedCat = selectedCat === cat ? null : cat;
  document.getElementById('cat-meal').classList.toggle('on', selectedCat==='餐費');
  document.getElementById('cat-other').classList.toggle('on', selectedCat==='其他');
}

function renderWhobtns() {
  document.getElementById('who-btns').innerHTML = MEMBERS.map((m,i) =>
    `<button class="who-btn ${selectedWho===i?'on-'+i:''}" onclick="selectWho(${i})">${m.name}</button>`
  ).join('');
}

function calcDebts() {
  const debts = {};
  MEMBERS.forEach(m => debts[m.name] = 0);
  entries.forEach(e => { if(debts[e.who] !== undefined) debts[e.who] += e.amount; });
  return debts;
}

function renderPeople() {
  const debts = calcDebts();
  document.getElementById('people-grid').innerHTML = MEMBERS.map(m => {
    const d = debts[m.name] || 0;
    return `<div class="person-card">
      <div class="avatar" style="background:${m.avbg};color:${m.avco}">${m.name[0]}</div>
      <div class="person-name">${m.name}</div>
      <div class="person-debt ${d>0?'debt-red':'debt-zero'}">NT$${Math.round(d).toLocaleString()}</div>
      <div class="person-label">${d>0?'欠款中':'已結清'}</div>
    </div>`;
  }).join('');
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return (d.getMonth()+1) + '/' + d.getDate();
}

function renderLog() {
  const now = new Date();
  document.getElementById('log-title').textContent = now.getFullYear() + '/' + (now.getMonth()+1) + '月 明細';
  const list = document.getElementById('log-list');
  const activeNames = new Set(MEMBERS.map(m => m.name));
  const visible = entries.filter(e => activeNames.has(e.who));
  if (!visible.length) { list.innerHTML = '<div class="empty-log">尚無記錄</div>'; return; }
  const colorMap = {};
  MEMBERS.forEach(m => colorMap[m.name] = m.avco);
  list.innerHTML = [...visible].reverse().map((e, ri) => {
    const origIdx = entries.indexOf(visible[visible.length - 1 - ri]);
    const col = colorMap[e.who] || '#888';
    const catClass = e.cat === '餐費' ? 'cat-meal' : 'cat-other';
    const catTag = e.cat ? `<span class="cat-tag ${catClass}">${e.cat}</span>` : '';
    const noteText = e.note || '';
    return `<div class="log-entry">
      <div class="log-left">
        <div class="log-note">${catTag}${noteText || '—'}</div>
        <div class="log-meta">${fmtDate(e.date)} ｜ <span style="color:${col}">${e.who}</span> 欠</div>
      </div>
      <div class="log-right">
        <span class="log-amt">NT$${Math.round(e.amount).toLocaleString()}</span>
        <button class="del-btn" onclick="delEntry(${origIdx})">×</button>
      </div>
    </div>`;
  }).join('');
}

function renderSettle() {
  const debts = calcDebts();
  const rows = document.getElementById('settle-rows');
  const activeNames = new Set(MEMBERS.map(m => m.name));
  const hasAny = entries.some(e => activeNames.has(e.who));
  if (!hasAny) { rows.innerHTML = '<div style="font-size:13px;color:#aaa">尚無記錄</div>'; return; }
  rows.innerHTML = MEMBERS.map(m => {
    const d = debts[m.name] || 0;
    if (d <= 0) return `<div class="settle-row"><span>${m.name}</span><span style="color:#aaa;font-size:13px">已結清</span></div>`;
    return `<div class="settle-row">
      <span style="font-weight:600">${m.name}</span>
      <span style="display:flex;align-items:center;gap:10px">
        <span style="color:#c0392b;font-weight:600">欠 NT$${Math.round(d).toLocaleString()}</span>
        <button class="paid-btn" onclick="markPaid('${m.name}')">已還清</button>
      </span>
    </div>`;
  }).join('');
}

function render() {
  renderPeople();
  renderWhobtns();
  renderLog();
  renderSettle();
}

async function addEntry() {
  if (!selectedCat) { setStatus('請選擇項目（餐費或其他）', 'err'); return; }
  if (selectedWho === null) { setStatus('請選擇欠款人', 'err'); return; }
  const amt = parseFloat(document.getElementById('amt').value);
  if (!amt || amt <= 0) { setStatus('請輸入金額', 'err'); return; }
  const note = document.getElementById('note').value.trim();

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '儲存中...';
  setStatus('');

  const now = new Date();
  const dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  try {
    const res = await apiCall({action:'add', date:dateStr, who:MEMBERS[selectedWho].name, amount:amt, cat:selectedCat, note});
    if (!res.ok) throw new Error(res.error);
    entries.push({date:dateStr, who:MEMBERS[selectedWho].name, amount:amt, cat:selectedCat, note});
    document.getElementById('amt').value = '';
    document.getElementById('note').value = '';
    setStatus('已儲存到 Google Sheets ✓', 'ok');
    render();
    setTimeout(() => setStatus(''), 2500);
  } catch(e) {
    setStatus('儲存失敗：' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '新增記帳';
  }
}

async function delEntry(i) {
  if (!confirm('刪除這筆記錄？')) return;
  const e = entries[i];
  setStatus('刪除中...');
  try {
    const res = await apiCall({action:'delete', date:e.date, who:e.who, amount:e.amount, cat:e.cat, note:e.note});
    if (!res.ok) throw new Error(res.error);
    entries.splice(i, 1);
    setStatus('已刪除', 'ok');
    render();
    setTimeout(() => setStatus(''), 2000);
  } catch(err) {
    setStatus('刪除失敗：' + err.message, 'err');
  }
}

async function markPaid(name) {
  if (!confirm(name + ' 已還清？網頁明細會隱藏，但 Sheets 資料保留。')) return;
  setStatus('處理中...');
  try {
    const res = await apiCall({action:'archivePerson', who:name});
    if (!res.ok) throw new Error(res.error);
    entries = entries.filter(e => e.who !== name);
    setStatus(name + ' 已結清 ✓', 'ok');
    render();
    setTimeout(() => setStatus(''), 2500);
  } catch(err) {
    setStatus('操作失敗：' + err.message, 'err');
  }
}

render();
loadData();
</script>
</body>
</html>
